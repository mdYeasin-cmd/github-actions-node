name: NodeJs GitHub Action

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3 # checkout the repository

      - name: Setup NodeJs
        uses: actions/setup-node@v4 # setup nodejs
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

